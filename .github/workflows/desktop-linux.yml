name: Linux desktop build

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "scripts/build-desktop-linux.sh"
      - ".github/workflows/desktop-linux.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "scripts/build-desktop-linux.sh"
      - ".github/workflows/desktop-linux.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      channel:
        type: string
        default: ""
      version:
        type: string
        default: ""
      publish:
        description: "Upload the AppImage and feeds to R2 and attach the .deb to the v<version> release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-linux-${{ github.ref }}-${{ inputs.channel }}
  cancel-in-progress: ${{ !inputs.publish }}

jobs:
  linux:
    name: Desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.channel != '' && 0 || 1 }}

      - name: Refuse a commit that is not on main
        if: inputs.channel != ''
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/main. Releases come from main."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: System packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libfuse2t64 libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1
          if [ "$(uname -m)" = "aarch64" ]; then
            sudo apt-get install -y ruby ruby-dev build-essential
            sudo gem install --no-document fpm
            echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
          fi

      - name: Build the AppImage and the .deb
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          FEED_PREFIX: ${{ inputs.publish && 'io.github.novarix.telar' || '' }}
          UPDATE_PROXY_URL: ${{ inputs.publish && secrets.UPDATE_PROXY_URL || '' }}
          UPDATE_PROXY_KEY: ${{ inputs.publish && secrets.UPDATE_PROXY_KEY || '' }}
        run: bash scripts/build-desktop-linux.sh ${CHANNEL:+--channel "$CHANNEL"} ${VERSION:+--version "$VERSION"} ${FEED_PREFIX:+--feed-prefix "$FEED_PREFIX"}

      # The AppImage has no AppArmor profile, so it needs the host to allow unprivileged user namespaces.
      - name: Smoke the AppImage under xvfb, sandboxed
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          appimage="$(ls apps/desktop/release/Telar-*.AppImage)"
          chmod +x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a node apps/desktop/test/electron/linux-smoke.js "$PWD/$appimage" | tee /tmp/smoke-appimage.log
          grep -q '^LINUX_SMOKE_OK' /tmp/smoke-appimage.log

      # Ubuntu's default restriction stays on: the postinst's AppArmor profile is what lets the .deb sandbox.
      - name: Install the .deb and smoke it under xvfb, sandboxed
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo apt-get install -y "$(ls "$PWD"/apps/desktop/release/Telar-*.deb)"
          grep -q 'x-scheme-handler/telar' /usr/share/applications/telar.desktop
          sudo grep -q '^telar ' /sys/kernel/security/apparmor/profiles
          test "$(stat -c %a /opt/Telar/chrome-sandbox)" = 755
          xvfb-run -a node apps/desktop/test/electron/linux-smoke.js /opt/Telar/telar | tee /tmp/smoke-deb.log
          grep -q '^LINUX_SMOKE_OK' /tmp/smoke-deb.log

      - uses: actions/upload-artifact@v4
        with:
          name: telar-linux-${{ runner.arch }}
          path: |
            apps/desktop/release/Telar-*.AppImage
            apps/desktop/release/Telar-*.deb
            apps/desktop/release/*-linux*.yml
            !apps/desktop/release/builder-*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to R2 and the release
    needs: linux
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: telar-linux-*
          path: release
          merge-multiple: true
      - name: Upload the AppImages, then the feeds
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          put() { aws s3 cp "$1" "s3://$R2_BUCKET/io.github.novarix.telar/$(basename "$1")" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress; }
          appimages=(release/*.AppImage)
          feeds=(release/*-linux*.yml)
          [ "${#appimages[@]}" -eq 2 ] && [ "${#feeds[@]}" -eq 2 ] || { echo "::error::expected two AppImages and two feeds"; exit 1; }
          for file in ${appimages[@]+"${appimages[@]}"} release/*.blockmap; do put "$file"; done
          for file in ${feeds[@]+"${feeds[@]}"}; do put "$file"; done
      - name: Attach the .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" release/*.deb --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$VERSION" release/*.deb --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "v$VERSION" \
              --notes "Linux .deb packages. The AppImage updates itself from the in-app updater."
          fi
