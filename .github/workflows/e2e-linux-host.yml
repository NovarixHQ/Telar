name: E2E Linux host

# Installs telar into a systemd Ubuntu container and drives it from the runner:
# service, browser, pairing, a stub turn, terminals, update and rollback.
# Optional: nightly, by hand, or on a pull request touching the harness.
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/e2e-linux-host/**"
      - ".github/workflows/e2e-linux-host.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: scripts/e2e-linux-host/run.sh
        env:
          E2E_WORK: ${{ runner.temp }}/telar-e2e
          UPDATE_PROXY_URL: ${{ github.event_name != 'pull_request' && secrets.UPDATE_PROXY_URL || '' }}
